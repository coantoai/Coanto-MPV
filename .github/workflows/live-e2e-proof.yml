name: COANTO Live E2E Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true
  BUN_VERSION: 1.4.2

jobs:
  real-company-decision-proof:
    if: github.head_ref == 'feat/coanto-live-e2e-r1-r60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Require Gemini secret without exposing it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run real Allbirds discovery → evidence gate → Decision Event
        env:
          COANTO_E2E_URL: https://www.allbirds.com/
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: bun run test:ai-live-e2e
