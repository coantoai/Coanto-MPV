name: Gemini Decision Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  gemini-decision-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.Gemini_coanto_one }}
      GEMINI_MODEL: gemini-3.1-flash-lite

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: npm run typecheck
      - name: Run Gemini diagnostic
        id: gemini
        continue-on-error: true
        run: npm run test:ai
      - name: Record Gemini diagnostic outcome
        if: always()
        run: echo "gemini-decision outcome=${{ steps.gemini.outcome }} conclusion=${{ steps.gemini.conclusion }}"
      - name: Run real public-site monitoring smoke
        run: npm run test:monitoring-live
      - name: Build
        run: npm run build
