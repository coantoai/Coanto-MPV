name: Gemini Decision Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  gemini-decision-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: GOOGLE_AGENT_TEST
    env:
      GEMINI_API_KEY: ${{ secrets.COANTO_GOOGLE_AGENT_TEST }}
      AI_BENCHMARK_PROVIDERS: gemini
      GEMINI_MODEL: gemini-3.1-flash-lite

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run Gemini diagnostic
        id: gemini
        run: npm run test:ai
      - name: Upload Gemini diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coanto-gemini-diagnostic-report
          path: ai-benchmark-report.json
          if-no-files-found: warn
          retention-days: 7
