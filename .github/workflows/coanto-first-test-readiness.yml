name: COANTO First Test Readiness

on:
  push:
    branches:
      - test/google-agent-isolated
    paths:
      - '.github/workflows/coanto-first-test-readiness.yml'
      - 'src/lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-and-live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: GOOGLE_AGENT_TEST
    env:
      CI: true
      GEMINI_API_KEY: ${{ secrets.COANTO_GOOGLE_AGENT_TEST }}
      GEMINI_DISCOVERY_MODEL: gemini-3.1-flash-lite
      INSFORGE_URL: ${{ secrets.INSFORGE_TEST_URL }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/google-agent-isolated
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused COANTO checks
        id: checks
        shell: bash
        run: |
          mkdir -p readiness
          printf '{"branch":"test/google-agent-isolated","checks":[' > readiness/report.json
          first=1
          run_check() {
            name="$1"; shift
            log="readiness/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then status=PASS; else status=FAIL; fi
            echo "$name: $status (exit $code)"
            if [ "$first" -eq 0 ]; then printf ',' >> readiness/report.json; fi
            first=0
            printf '{"name":"%s","status":"%s","exit_code":%s,"log":"%s"}' "$name" "$status" "$code" "$log" >> readiness/report.json
          }
          set -e
          run_check typecheck bun run typecheck
          run_check lint bun run lint
          run_check competitor_discovery bun run test:competitor-discovery
          run_check ai_contract bun run test:ai-contract
          run_check evidence bun run test:evidence
          run_check evidence_collector bun run test:evidence-collector
          run_check evidence_graph bun run test:evidence-graph
          run_check claim_engine bun run test:claim
          run_check research_proof bun run test:research-proof
          run_check trust_engine bun run test:trust
          run_check decision_engine bun run test:decision-engine
          run_check build bun run build
          printf '],"generated_at":"%s"}\n' "$(date -u +%FT%TZ)" >> readiness/report.json
          node -e "const r=require('./readiness/report.json'); const failed=r.checks.filter(x=>x.status==='FAIL'); console.log(JSON.stringify({total:r.checks.length,passed:r.checks.length-failed.length,failed:failed.map(x=>x.name)},null,2)); process.exit(failed.length?1:0)"

      - name: Live Gemini grounded discovery on Allbirds
        id: gemini_live
        if: always()
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "BLOCKED: COANTO_GOOGLE_AGENT_TEST secret is unavailable in GOOGLE_AGENT_TEST environment."
            echo '{"name":"gemini_grounded_allbirds","status":"BLOCKED","reason":"Gemini test secret unavailable"}' > readiness/gemini-live-status.json
            exit 0
          fi
          set +e
          bun run test:live > readiness/gemini-live.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then status=PASS; else status=FAIL; fi
          echo "{\"name\":\"gemini_grounded_allbirds\",\"status\":\"$status\",\"exit_code\":$code}" > readiness/gemini-live-status.json
          exit "$code"

      - name: InsForge isolated database integration smoke
        id: insforge_crud
        if: always()
        shell: bash
        run: |
          if [ -z "$INSFORGE_URL" ] || [ -z "$INSFORGE_API_KEY" ]; then
            echo "BLOCKED: isolated InsForge test credentials unavailable."
            exit 1
          fi
          bun run test:insforge

      - name: Read-only InsForge connectivity probe
        id: insforge_probe
        if: always()
        shell: bash
        run: |
          if [ -z "$INSFORGE_URL" ] || [ -z "$INSFORGE_API_KEY" ]; then
            echo '{"name":"insforge_readonly_connectivity","status":"BLOCKED","reason":"INSFORGE_TEST_URL or INSFORGE_TEST_API_KEY missing"}' > readiness/insforge-status.json
            echo "BLOCKED: isolated InsForge test credentials not configured."
            exit 0
          fi
          node --input-type=module <<'NODE' > readiness/insforge-probe.log 2>&1
          const base = process.env.INSFORGE_URL.replace(/\/$/, '');
          const response = await fetch(base + '/api/deployments/metadata', {
            headers: { Authorization: 'Bearer ' + process.env.INSFORGE_API_KEY }
          });
          if (!response.ok) throw new Error('InsForge metadata endpoint returned HTTP ' + response.status);
          console.log('INSFORGE_READ_ONLY_METADATA_OK');
          NODE
          code=$?
          if [ "$code" -eq 0 ]; then status=PASS; else status=FAIL; fi
          echo "{\"name\":\"insforge_readonly_connectivity\",\"status\":\"$status\",\"exit_code\":$code}" > readiness/insforge-status.json
          exit "$code"

      - name: Upload sanitized readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coanto-first-test-readiness
          path: readiness/
          if-no-files-found: warn
          retention-days: 14
