name: Verify COANTO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [typecheck, lint, smoke, build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          case "${{ matrix.check }}" in
            typecheck) bun run typecheck ;;
            lint) bun run lint ;;
            smoke) bun run test:smoke ;;
            build) bun run build ;;
          esac

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start production server
        run: |
          bun run start > runtime.log 2>&1 &
          echo $! > runtime.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/coanto.html; then exit 0; fi
            sleep 1
          done
          cat runtime.log
          exit 1
      - name: Validate rendered app
        run: |
          test -s /tmp/coanto.html
          grep -Eqi "COANTO|competitive|decision" /tmp/coanto.html
      - name: Stop production server
        if: always()
        run: if [ -f runtime.pid ]; then kill "$(cat runtime.pid)" || true; fi

  live-discovery:
    if: ${{ vars.ENABLE_LIVE_DISCOVERY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/live-smoke.ts
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BING_SEARCH_V7_KEY: ${{ secrets.BING_SEARCH_V7_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

  ai-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/ai-benchmark.ts | tee ai-benchmark.log
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      - uses: actions/upload-artifact@v4
        with:
          name: coanto-ai-benchmark
          path: |
            ai-benchmark-report.json
            ai-benchmark.log
