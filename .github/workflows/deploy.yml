name: Verify COANTO

on:
  push:
    branches: [main, staging, stage-2-evidence]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, smoke, architecture, evidence, evidence-collector, claim, evidence-graph, research-proof, ai-contract, build, monitoring-live]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: |
          case "${{ matrix.check }}" in
            typecheck) bun run typecheck ;;
            lint) bun run lint ;;
            smoke) bun run test:smoke ;;
            architecture) bun run test:architecture ;;
            evidence) bun run test:evidence ;;
            evidence-collector) bun run test:evidence-collector ;;
            claim) bun run test:claim ;;
            evidence-graph) bun run test:evidence-graph ;;
            research-proof) bun run test:research-proof ;;
            ai-contract) bun run test:ai-contract ;;
            build) bun run build ;;
            monitoring-live) bun run test:monitoring-live ;;
          esac

  insforge-integration:
    name: InsForge integration
    runs-on: ubuntu-latest
    needs: verify
    env:
      INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
    steps:
      - name: Require InsForge configuration
        run: |
          [ -n "$INSFORGE_URL" ] || (echo "INSFORGE_URL=missing" && exit 1)
          [ -n "$INSFORGE_API_KEY" ] || (echo "INSFORGE_API_KEY=missing" && exit 1)
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Apply COANTO schema and verify real persistence
        run: bun run test:insforge

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Start production server
        run: |
          bun run start > runtime.log 2>&1 &
          echo $! > runtime.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/coanto.html; then exit 0; fi
            sleep 1
          done
          cat runtime.log
          exit 1
      - name: Validate rendered app
        run: |
          test -s /tmp/coanto.html
          grep -Eqi "COANTO|competitive|decision" /tmp/coanto.html
      - name: Validate health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/coanto-health.json
          grep -Eq '\"ok\":true' /tmp/coanto-health.json
          grep -Eq '\"service\":\"coanto\"' /tmp/coanto-health.json
      - name: Validate product routes
        run: |
          for path in /decision /memory /monitoring /business-intelligence; do
            curl --fail --silent --show-error "http://127.0.0.1:3000${path}" > "/tmp/coanto-${path#/}.html"
            test -s "/tmp/coanto-${path#/}.html"
          done
      - name: Stop production server
        if: always()
        run: if [ -f runtime.pid ]; then kill "$(cat runtime.pid)" || true; fi

  ai-live-e2e:
    name: AI live E2E (Gemini only)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run real Gemini end-to-end test
        env:
          COANTO_E2E_URL: https://www.allbirds.com/
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: bun run test:ai-live-e2e

  live-discovery:
    name: Live discovery (Gemini only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run live discovery with Gemini
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/live-smoke.ts 2>&1 | tee live-smoke.log
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BING_SEARCH_V7_KEY: ${{ secrets.BING_SEARCH_V7_KEY }}
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      - name: Record live discovery outcome
        if: always()
        run: echo "live-discovery outcome=${{ steps.live.outcome }} conclusion=${{ steps.live.conclusion }}"
      - name: Upload live discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coanto-live-discovery
          path: |
            live-smoke.log

  ai-benchmark:
    name: AI benchmark (Gemini only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run Gemini benchmark
        id: benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/ai-benchmark.ts | tee ai-benchmark.log
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      - name: Record AI benchmark outcome
        if: always()
        run: echo "ai-benchmark outcome=${{ steps.benchmark.outcome }} conclusion=${{ steps.benchmark.conclusion }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coanto-ai-benchmark
          path: |
            ai-benchmark-report.json
            ai-benchmark.log
