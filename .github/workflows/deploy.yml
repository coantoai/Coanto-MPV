name: Verify COANTO

on:
  push:
    branches: [main, staging, stage-2-evidence]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BUN_VERSION: 1.4.2

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, smoke, architecture, onboarding, competitor-discovery, evidence, evidence-collector, claim, evidence-graph, research-proof, ai-contract, build, monitoring-live, monitoring-engine, intelligence-engine, decision-engine, dashboard, alerts-reports, apify, security, performance-cost, billing, production-qa, launch-readiness]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: |
          case "${{ matrix.check }}" in
            typecheck) bun run typecheck ;;
            lint) bun run lint ;;
            smoke) bun run test:smoke ;;
            architecture) bun run test:architecture ;;
            onboarding) bun run test:onboarding ;;
            competitor-discovery) bun run test:competitor-discovery ;;
            evidence) bun run test:evidence ;;
            evidence-collector) bun run test:evidence-collector ;;
            claim) bun run test:claim ;;
            evidence-graph) bun run test:evidence-graph ;;
            research-proof) bun run test:research-proof ;;
            ai-contract) bun run test:ai-contract ;;
            build) bun run build ;;
            monitoring-live) bun run test:monitoring-live ;;
            monitoring-engine) bun run test:monitoring-engine ;;
            intelligence-engine) bun run test:intelligence-engine ;;
            decision-engine) bun run test:decision-engine ;;
            dashboard) bun run test:dashboard ;;
            alerts-reports) bun run test:alerts-reports ;;
            apify) bun run test:apify ;;
            security) bun run test:security ;;
            performance-cost) bun run test:performance-cost ;;
            billing) bun run test:billing ;;
            production-qa) bun run test:production-qa ;;
            launch-readiness) bun run test:launch-readiness ;;
          esac

  insforge-integration:
    name: InsForge integration
    runs-on: ubuntu-latest
    needs: verify
    env:
      INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
    steps:
      - name: Require InsForge configuration
        run: |
          [ -n "$INSFORGE_URL" ] || (echo "INSFORGE_URL=missing" && exit 1)
          [ -n "$INSFORGE_API_KEY" ] || (echo "INSFORGE_API_KEY=missing" && exit 1)
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Apply COANTO schema and verify real persistence
        run: bun run test:insforge
      - name: Apply and verify Apify acquisition provenance schema
        run: bun run test:insforge-apify
      - name: Apply and verify performance cost-control schema
        run: bun run test:insforge-performance
      - name: Apply and verify provider-neutral billing schema
        run: bun run test:insforge-billing
      - name: Apply and verify durable authentication throttling
        run: bun run test:insforge-auth

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run build
      - name: Start production server
        run: |
          bun run start > runtime.log 2>&1 &
          echo $! > runtime.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/coanto.html; then exit 0; fi
            sleep 1
          done
          cat runtime.log
          exit 1
      - name: Validate rendered app
        run: |
          test -s /tmp/coanto.html
          grep -Eqi "COANTO|competitive|decision|command" /tmp/coanto.html
      - name: Validate health endpoint and security headers
        run: |
          curl --fail --silent --show-error -D /tmp/coanto-health.headers http://127.0.0.1:3000/api/health > /tmp/coanto-health.json
          grep -Eq '"ok":true' /tmp/coanto-health.json
          grep -Eq '"service":"coanto"' /tmp/coanto-health.json
          grep -Eq '"release":\{' /tmp/coanto-health.json
          grep -Eqi '^x-content-type-options: nosniff' /tmp/coanto-health.headers
          grep -Eqi '^x-frame-options: DENY' /tmp/coanto-health.headers
          grep -Eqi '^cache-control: no-store' /tmp/coanto-health.headers
          grep -Eqi '^x-request-id: .+' /tmp/coanto-health.headers
      - name: Validate readiness failure semantics without backend configuration
        run: |
          code=$(curl --silent --show-error -o /tmp/coanto-ready.json -D /tmp/coanto-ready.headers -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          test "$code" = "503"
          grep -Eq '"ready":false' /tmp/coanto-ready.json
          grep -Eq '"insforge":"unavailable"' /tmp/coanto-ready.json
          grep -Eq '"release":\{' /tmp/coanto-ready.json
          grep -Eqi '^x-content-type-options: nosniff' /tmp/coanto-ready.headers
          grep -Eqi '^cache-control: no-store' /tmp/coanto-ready.headers
      - name: Validate unauthenticated and cross-origin boundaries
        run: |
          code=$(curl --silent --show-error -o /tmp/auth.json -w '%{http_code}' http://127.0.0.1:3000/api/auth); test "$code" = "401"
          code=$(curl --silent --show-error -o /tmp/context.json -w '%{http_code}' http://127.0.0.1:3000/api/business-context); test "$code" = "401"
          code=$(curl --silent --show-error -o /tmp/competitors.json -w '%{http_code}' http://127.0.0.1:3000/api/competitors); test "$code" = "401"
          code=$(curl --silent --show-error -o /tmp/cron.json -D /tmp/cron.headers -w '%{http_code}' http://127.0.0.1:3000/api/monitoring-cron); test "$code" = "401"
          grep -Eqi '^x-content-type-options: nosniff' /tmp/cron.headers
          code=$(curl --silent --show-error -o /tmp/analyze.json -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:3000/api/analyze); test "$code" = "401"
          code=$(curl --silent --show-error -o /tmp/cross-auth.json -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data '{"action":"signin","email":"qa@example.com","password":"12345678"}' http://127.0.0.1:3000/api/auth); test "$code" = "403"
      - name: Validate product routes
        run: |
          for path in /analysis /onboarding /competitors /decision /memory /history /monitoring /business-intelligence /alerts /reports /pricing /billing /demo; do
            curl --fail --silent --show-error "http://127.0.0.1:3000${path}" > "/tmp/coanto-${path#/}.html"
            test -s "/tmp/coanto-${path#/}.html"
          done
      - name: Stop production server
        if: always()
        run: if [ -f runtime.pid ]; then kill "$(cat runtime.pid)" || true; fi

  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    needs: [verify, insforge-integration, runtime-smoke]
    steps:
      - name: Record verified release candidate
        run: echo "PRODUCTION_GATE_OK sha=${GITHUB_SHA} ref=${GITHUB_REF}"

  ai-live-e2e:
    name: AI live E2E (Gemini diagnostic)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run real Gemini end-to-end test
        id: gemini_live
        continue-on-error: true
        env:
          COANTO_E2E_URL: https://www.allbirds.com/
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: bun run test:ai-live-e2e
      - name: Record Gemini diagnostic outcome
        if: always()
        run: echo "gemini-live outcome=${{ steps.gemini_live.outcome }} conclusion=${{ steps.gemini_live.conclusion }}"

  live-discovery:
    name: Live discovery (Gemini only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run live discovery with Gemini
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/live-smoke.ts 2>&1 | tee live-smoke.log
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BING_SEARCH_V7_KEY: ${{ secrets.BING_SEARCH_V7_KEY }}
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      - name: Record live discovery outcome
        if: always()
        run: echo "live-discovery outcome=${{ steps.live.outcome }} conclusion=${{ steps.live.conclusion }}"
      - name: Upload live discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coanto-live-discovery
          path: |
            live-smoke.log

  ai-benchmark:
    name: AI benchmark (Gemini only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Verify Gemini secret wiring without exposing the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || (echo "GEMINI_API_KEY=missing" && exit 1)
      - name: Run Gemini benchmark
        id: benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/ai-benchmark.ts | tee ai-benchmark.log
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      - name: Record AI benchmark outcome
        if: always()
        run: echo "ai-benchmark outcome=${{ steps.benchmark.outcome }} conclusion=${{ steps.benchmark.conclusion }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coanto-ai-benchmark
          path: |
            ai-benchmark-report.json
            ai-benchmark.log
