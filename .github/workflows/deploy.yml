name: Verify COANTO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, smoke, ai-contract, build]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: |
          case "${{ matrix.check }}" in
            typecheck) bun run typecheck ;;
            lint) bun run lint ;;
            smoke) bun run test:smoke ;;
            ai-contract) bun run test:ai-contract ;;
            build) bun run build ;;
          esac

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Start production server
        run: |
          bun run start > runtime.log 2>&1 &
          echo $! > runtime.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/coanto.html; then exit 0; fi
            sleep 1
          done
          cat runtime.log
          exit 1
      - name: Validate rendered app
        run: |
          test -s /tmp/coanto.html
          grep -Eqi "COANTO|competitive|decision" /tmp/coanto.html
      - name: Validate health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/coanto-health.json
          grep -Eq '"ok":true' /tmp/coanto-health.json
          grep -Eq '"service":"coanto"' /tmp/coanto-health.json
      - name: Stop production server
        if: always()
        run: if [ -f runtime.pid ]; then kill "$(cat runtime.pid)" || true; fi

  live-discovery:
    name: Live discovery (diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Verify AI provider secret wiring without exposing secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_COANTO_ONE || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_COANTO || secrets.OPENROUTER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_COANTO_ONE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] && echo "OPENROUTER_API_KEY=present" || echo "OPENROUTER_API_KEY=missing"
          [ -n "$OPENAI_API_KEY" ] && echo "OPENAI_API_KEY=present" || echo "OPENAI_API_KEY=missing"
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=present" || echo "GEMINI_API_KEY=missing"
      - name: Inspect accessible Actions secret names (names only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh secret list --repo "${GITHUB_REPOSITORY}" --app actions > actions-secrets.txt 2>&1; then
            echo "Actions secret listing succeeded. Names only:"
            cat actions-secrets.txt | sed -E 's/[[:space:]]+[0-9]+.*$//' | sort -u
          else
            echo "Actions secret listing is not permitted by GITHUB_TOKEN; runtime wiring check remains authoritative."
            cat actions-secrets.txt || true
          fi
      - name: Run live discovery
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/live-smoke.ts 2>&1 | tee live-smoke.log
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BING_SEARCH_V7_KEY: ${{ secrets.BING_SEARCH_V7_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_COANTO_ONE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_COANTO_ONE || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_COANTO || secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_COANTO_ONE }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-fable-5' }}
      - name: Record live discovery outcome
        if: always()
        run: echo "live-discovery outcome=${{ steps.live.outcome }} conclusion=${{ steps.live.conclusion }}"
      - name: Upload live discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coanto-live-discovery
          path: |
            live-smoke.log
            actions-secrets.txt

  ai-benchmark:
    name: AI benchmark (diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Verify OpenRouter secret wiring without exposing the value
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_COANTO_ONE || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_COANTO || secrets.OPENROUTER_KEY }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] && echo "OPENROUTER_API_KEY=present" || echo "OPENROUTER_API_KEY=missing"
      - name: Run AI benchmark
        id: benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          bun scripts/ai-benchmark.ts | tee ai-benchmark.log
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_COANTO_ONE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_COANTO_ONE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_COANTO_ONE || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_COANTO || secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_COANTO_ONE }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-fable-5' }}
      - name: Record AI benchmark outcome
        if: always()
        run: echo "ai-benchmark outcome=${{ steps.benchmark.outcome }} conclusion=${{ steps.benchmark.conclusion }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coanto-ai-benchmark
          path: |
            ai-benchmark-report.json
            ai-benchmark.log
